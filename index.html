<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI Video Maker</title>
    <style>
        :root { --primary: #6C63FF; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--primary); text-shadow: 0 0 10px rgba(108, 99, 255, 0.5); }
        .container { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        /* Controls */
        .controls { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        input, textarea, select { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: white; border-radius: 5px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #5a52d5; transform: scale(1.02); }
        button:disabled { background: #555; cursor: not-allowed; }

        /* Preview Area */
        .preview-area { background: black; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; border: 2px solid #333; }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        
        /* Status */
        #status { margin-top: 10px; color: #aaa; font-size: 14px; }
        .recording-indicator { display: none; color: red; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <h1><i class="fas fa-video"></i> صانع الفيديو الاحترافي</h1>

    <div class="container">
        <!-- Left Column: Controls -->
        <div class="controls">
            <label>عنوان الفيديو:</label>
            <input type="text" id="videoTitle" value="مرحباً بك في منتجنا المذهل" oninput="drawFrame()">

            <label>الوصف التفصيلي:</label>
            <textarea id="videoDesc" rows="3" oninput="drawFrame()">اكتب هنا تفاصيل المنتج الذي ترغب في الترويج له...</textarea>

            <label>نوع الموسيقى (محاكاة):</label>
            <select id="musicType">
                <option value="energetic">طاقة عالية (Energetic)</option>
                <option value="calm">هادئ ومريح (Calm)</option>
                <option value="corporate">شركات احترافية (Corporate)</option>
            </select>

            <label>المدة (بالدقائق):</label>
            <input type="range" id="duration" min="1" max="5" value="1" step="0.5" oninput="updateDurationLabel(this.value)">

            <button id="generateBtn" onclick="startRecording()">
                <i class="fas fa-magic"></i> إنشاء وتحميل الفيديو
            </button>
            <div style="margin-top: 10px; text-align: center;">
                <span id="durationLabel">المدة: 1 دقيقة</span>
            </div>
        </div>

        <!-- Right Column: Preview -->
        <div>
            <div class="preview-area">
                <canvas id="videoCanvas" width="1280" height="720"></canvas>
                <div class="recording-indicator" id="recIndicator">● جاري التسجيل...</div>
            </div>
            <div id="status">جاهز للإنشاء</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let startTime;
        let isRecording = false;

        // Initial Draw
        drawFrame();

        function updateDurationLabel(val) {
            document.getElementById('durationLabel').innerText = `المدة: ${val} دقيقة`;
        }

        function drawFrame(timestamp) {
            if (!startTime) startTime = timestamp;
            const timeElapsed = (timestamp - startTime) / 1000; // seconds

            // Background Gradient
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Animated Particles (Simulated)
            ctx.fillStyle = 'rgba(108, 99, 255, 0.1)';
            for(let i=0; i<10; i++) {
                ctx.beginPath();
                ctx.arc((Math.sin(timeElapsed + i) * 200) + canvas.width/2, (Math.cos(timeElapsed + i) * 100) + canvas.height/2, 50, 0, Math.PI*2);
                ctx.fill();
            }

            // Title Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor = "#6C63FF";
            ctx.shadowBlur = 20;
            ctx.fillText(document.getElementById('videoTitle').value, canvas.width/2, canvas.height/2 - 50);
            
            // Description Text
            ctx.shadowBlur = 0;
            ctx.font = '30px Arial';
            ctx.fillStyle = '#cccccc';
            wrapText(ctx, document.getElementById('videoDesc').value, canvas.width/2, canvas.height/2 + 50, canvas.width - 100, 40);

            // Footer Info
            ctx.fillStyle = '#6C63FF';
            ctx.font = '20px Arial';
            ctx.fillText(`AI Generated | ${document.getElementById('musicType').value}`, canvas.width/2, canvas.height - 50);

            if (!isRecording) {
                animationId = requestAnimationFrame(drawFrame);
            }
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
        }

        function startRecording() {
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            const indicator = document.getElementById('recIndicator');
            
            btn.disabled = true;
            status.innerText = "جاري المعالجة...";
            indicator.style.display = "block";

            // Reset Animation Time
            startTime = null; 
            
            // Capture Stream from Canvas
            const stream = canvas.captureStream(30); // 30 FPS
            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            
            const chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ai-video-${Date.now()}.webm`;
                a.click();
                
                btn.disabled = false;
                status.innerText = "تم تحميل الفيديو بنجاح!";
                indicator.style.display = "none";
                cancelAnimationFrame(animationId);
                drawFrame(); // Stop loop
            };

            mediaRecorder.start();
            
            // Start Animation Loop manually for recording
            startTime = performance.now();
            
            // Calculate duration based on user selection (convert minutes to ms)
            const durationMs = parseFloat(document.getElementById('duration').value) * 60 * 1000;
            
            // Cap at reasonable demo time or use full duration
            setTimeout(() => {
                mediaRecorder.stop();
            }, durationMs);

            // Keep drawing while recording
            function recordLoop(ts) {
                drawFrame(ts);
                if(mediaRecorder.state === 'recording') {
                    requestAnimationFrame(recordLoop);
                }
            }
            requestAnimationFrame(recordLoop);
        }
    </script>
</body>
</html>
