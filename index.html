<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع الفيديو الذكي - نسخة الفيديو الحقيقي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        input, textarea, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #6C63FF; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #5A52D5; }
        video { width: 100%; margin-top: 20px; border: 2px solid #6C63FF; border-radius: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 صانع الفيديو بالذكاء الاصطناعي</h1>
        
        <label>اكتب نص الفيديو:</label>
        <textarea id="videoText" rows="4" placeholder="مثال: مرحباً بكم في منتجنا الجديد..."></textarea>
        
        <label>اختر الموسيقى (رابط مباشر):</label>
        <input type="text" id="musicUrl" placeholder="https://example.com/music.mp3" value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
        
        <button onclick="generateVideo()">إنشاء وتحميل الفيديو</button>
        
        <div id="status" style="margin-top: 10px; color: yellow;"></div>
        
        <div id="resultArea" class="hidden">
            <h3>تم إنشاء الفيديو بنجاح!</h3>
            <video id="videoPlayer" controls></video>
            <br>
            <a id="downloadLink" download="my_promo_video.webm" style="display:block; margin-top:10px; text-decoration:none;">
                <button style="background: #4ECDC4;">تحميل الفيديو (WebM)</button>
            </a>
        </div>
    </div>

    <script>
        async function generateVideo() {
            const status = document.getElementById('status');
            const resultArea = document.getElementById('resultArea');
            const videoPlayer = document.getElementById('videoPlayer');
            const downloadLink = document.getElementById('downloadLink');
            
            resultArea.classList.add('hidden');
            status.textContent = "جاري المعالجة... يرجى الانتظار";
            
            // إعداد الكانفاس للرسم
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');
            
            // التقاط الصوت من الصفحة (لدمج الموسيقى)
            const audioEl = new Audio(document.getElementById('musicUrl').value);
            audioEl.crossOrigin = "anonymous";
            await audioEl.play();
            
            const audioCtx = new AudioContext();
            const source = audioCtx.createMediaElementSource(audioEl);
            const dest = audioCtx.createMediaStreamDestination();
            source.connect(dest);
            source.connect(audioCtx.destination); // لسماع الصوت أثناء المعالجة
            
            // دمج فيديو الكانفاس مع صوت الموسيقى
            const canvasStream = canvas.captureStream(30); // 30 FPS
            const combinedStream = new MediaStream([
                ...canvasStream.getTracks(),
                ...dest.stream.getTracks()
            ]);
            
            const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
            const chunks = [];
            
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                videoPlayer.src = url;
                downloadLink.href = url;
                resultArea.classList.remove('hidden');
                status.textContent = "تم الانتهاء! يمكنك الآن مشاهدة وتحميل الفيديو.";
                audioEl.pause();
            };
            
            recorder.start();
            
            // رسم الفيديو (محاكاة بسيطة لحركة النص)
            let startTime = Date.now();
            const duration = 10000; // 10 ثواني كمثال
            
            function drawFrame() {
                const now = Date.now();
                const progress = (now - startTime) / duration;
                
                if (progress >= 1) {
                    recorder.stop();
                    return;
                }
                
                // خلفية متدرجة
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#1a1a2e');
                gradient.addColorStop(1, '#16213e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // رسم نص متحرك
                ctx.fillStyle = 'white';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                const text = document.getElementById('videoText').value || "فيديو تجريبي";
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                
                // شريط تقدم
                ctx.fillStyle = '#6C63FF';
                ctx.fillRect(0, canvas.height - 10, canvas.width * progress, 10);
                
                requestAnimationFrame(drawFrame);
            }
            
            drawFrame();
        }
    </script>
</body>
</html>
